[tool.poetry]
name = "bank-masks"
version = "0.1.0"
description = "Bank card and account masking tool"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.lint.dependencies]
flake8 = "^6.1.0"
black = "^24.3.0"
isort = "^5.13.2"
mypy = "^1.9.0"

[tool.black]
line-length = 119
exclude = '''
\.git
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203"]
exclude = [".venv", ".git", "htmlcov", ".pytest_cache", ".mypy_cache"]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
